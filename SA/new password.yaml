openapi: 3.0.0
info:
  title: API Сброса Пароля
  version: 1.0.0
  description: Эндпоинт для сброса пароля. На email пользователя отправляется новый постоянный пароль.

paths:
  /api/v1/auth/password/reset:
    post:
      tags:
        - Сброс пароля
      summary: Сбросить пароль
      description: >
        Выполняет полноценный сброс пароля пользователя.
        Если указанный email существует, сервер генерирует новый постоянный пароль
        и отправляет его на email.
        Ответ всегда положительный, чтобы не раскрывать наличие пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        "200":
          description: Новый пароль отправлен на email пользователя.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Если такой email существует, новый пароль отправлен."
        "429":
          description: Слишком много запросов — ограничение по времени.
