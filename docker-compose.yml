version: "3"

services:

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "10004:10004"
    depends_on:
      - syncslot_db
      - syncslot_db_test
    volumes:
      - ./storage:/syncslot/backend/storage
    networks:
      - syncslot_network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - syncslot_network
    environment:
      VITE_API_URL: "http://backend:10004"

  syncslot_db:
    image: postgres:17.1
    container_name: "syncslot_db"
    hostname: 'syncslot_db'
    volumes:
      - syncslot_data:/var/lib/postgresql/data/
    restart: always
    environment:
      POSTGRES_DB: syncslot_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"
    networks:
      - syncslot_network

  syncslot_db_test:
    image: postgres:17.1
    container_name: "syncslot_db_test"
    hostname: 'db_test'
    restart: always
    environment:
      POSTGRES_DB: syncslot_db_test
      POSTGRES_USER: pguser_test
      POSTGRES_PASSWORD: pgpassword_test
    ports:
      - "54349:5432"
    networks:
      - syncslot_network

redis:
    image: redis:7-alpine
    container_name: syncslot-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - syncslot_network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  syncslot_data:
  redis_data:

networks:
  syncslot_network:
    driver: bridge

